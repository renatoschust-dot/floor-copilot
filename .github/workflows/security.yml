name: security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install scanners and deps
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q bandit pip-audit
          python -m pip install -q -r requirements.txt
      - name: pip-audit
        run: pip-audit -r requirements.txt
      - name: Bandit (high severity, every service module)
        run: bandit -q -r app.py invoice_extract.py meta_adapter.py evidence.py inspect_part.py -lll
      - name: Secret scan
        run: |
          if grep -RInE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' \
             --exclude-dir=.git --exclude-dir=__pycache__ .; then
            echo "secret pattern found"; exit 1
          fi
